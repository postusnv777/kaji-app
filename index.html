<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4f86c6" />
  <title>家事・家計管理</title>

  <!-- PWA用マニフェストリンク（後でmanifest.jsonを追加する場合はここを有効化） -->
  <!-- <link rel="manifest" href="manifest.json" /> -->

  <style>
    /* ===== リセット & ベース ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #4f86c6;
      --primary-dark: #3a6ea8;
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1a1a2e;
      --muted: #6b7280;
      --border: #e5e7eb;
      --danger: #ef4444;
      --success: #22c55e;
      --radius: 12px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Meiryo", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ===== ヘッダー ===== */
    header {
      background: var(--primary);
      color: #fff;
      padding: 16px 20px 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    header h1 { font-size: 1.3rem; font-weight: 700; }
    header p { font-size: 0.78rem; opacity: 0.85; margin-top: 2px; }

    /* ===== メインレイアウト ===== */
    main { max-width: 600px; margin: 0 auto; padding: 16px 16px 100px; }

    /* ===== カテゴリタブ ===== */
    .category-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 12px;
      scrollbar-width: none;
    }
    .category-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex-shrink: 0;
      padding: 6px 16px;
      border-radius: 999px;
      border: 2px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
      font-weight: 500;
    }
    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* ===== タスク追加フォーム ===== */
    .add-form {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 16px;
    }
    .add-form h2 { font-size: 0.9rem; color: var(--muted); margin-bottom: 12px; }
    .form-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .form-row input, .form-row select {
      flex: 1;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    .form-row input:focus, .form-row select:focus {
      border-color: var(--primary);
    }
    .form-row select { flex: 0 0 auto; min-width: 110px; }
    .btn-add {
      width: 100%;
      padding: 11px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-add:hover { background: var(--primary-dark); }
    .btn-add:active { transform: scale(0.98); }

    /* ===== タスクリスト ===== */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0 10px;
    }
    .section-header h2 { font-size: 1rem; font-weight: 700; }
    .count-badge {
      font-size: 0.75rem;
      background: var(--primary);
      color: #fff;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .task-list { display: flex; flex-direction: column; gap: 8px; }

    .task-item {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: opacity 0.2s;
    }
    .task-item.done { opacity: 0.5; }

    /* チェックボックス */
    .task-check {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      border: 2px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      background: var(--bg);
    }
    .task-item.done .task-check {
      background: var(--success);
      border-color: var(--success);
    }
    .task-check svg { display: none; }
    .task-item.done .task-check svg { display: block; }

    .task-body { flex: 1; min-width: 0; }
    .task-name {
      font-size: 0.98rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .task-item.done .task-name { text-decoration: line-through; }
    .task-meta {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      align-items: center;
    }
    .cat-tag {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .task-date { font-size: 0.72rem; color: var(--muted); }

    .btn-delete {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.15s;
      flex-shrink: 0;
    }
    .btn-delete:hover { color: var(--danger); }

    /* 完了済みセクション */
    .done-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.85rem;
      cursor: pointer;
      padding: 8px 0;
      margin-top: 16px;
      border-top: 1px solid var(--border);
      user-select: none;
    }
    .done-toggle svg { transition: transform 0.2s; }
    .done-toggle.open svg { transform: rotate(90deg); }

    /* 空状態 */
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }
    .empty .icon { font-size: 3rem; margin-bottom: 12px; }
    .empty p { font-size: 0.9rem; }

    /* カテゴリ色 */
    .cat-掃除  { background: #fef3c7; color: #92400e; }
    .cat-洗濯  { background: #dbeafe; color: #1e40af; }
    .cat-料理  { background: #dcfce7; color: #166534; }
    .cat-買い物 { background: #fce7f3; color: #9d174d; }
    .cat-その他 { background: #f3f4f6; color: #374151; }

    /* ===== ページナビゲーション ===== */
    .page-nav {
      display: flex;
      background: var(--primary-dark);
    }
    .page-nav-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      color: rgba(255,255,255,0.65);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.15s;
    }
    .page-nav-btn.active {
      color: #fff;
      border-bottom-color: #fff;
    }

    /* ===== 家計簿セクション ===== */
    #page-kakeibo { display: none; }
    #page-kaji { display: block; }

    .kakeibo-import {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 16px;
      text-align: center;
    }
    .kakeibo-import p {
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .btn-import {
      display: inline-block;
      padding: 10px 24px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-import:active { transform: scale(0.97); }
    #csv-file-input { display: none; }

    .kakeibo-month-selector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 16px;
    }
    .month-nav-btn {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      width: 36px; height: 36px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #current-month-label {
      font-size: 1rem;
      font-weight: 700;
      min-width: 100px;
      text-align: center;
    }

    .kakeibo-summary {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 16px;
    }
    .kakeibo-summary h2 {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .summary-total {
      font-size: 1.4rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 14px;
      color: var(--primary-dark);
    }
    .summary-rows { display: flex; flex-direction: column; gap: 6px; }
    .summary-row {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 8px;
      transition: background 0.1s;
    }
    .summary-row:hover { background: var(--bg); }
    .summary-row.active { background: var(--bg); }
    .summary-cat-label {
      flex: 1;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .summary-bar-wrap {
      flex: 2;
      height: 8px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
    }
    .summary-bar {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s;
    }
    .summary-amount {
      font-size: 0.88rem;
      font-weight: 600;
      min-width: 72px;
      text-align: right;
    }

    .kakeibo-detail {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 16px;
    }
    .kakeibo-detail h2 {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .detail-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.88rem;
    }
    .detail-item:last-child { border-bottom: none; }
    .detail-date { color: var(--muted); min-width: 48px; }
    .detail-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .detail-amount { font-weight: 600; min-width: 72px; text-align: right; }
    .detail-cat-tag {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 999px;
      font-weight: 600;
      flex-shrink: 0;
    }

    /* カテゴリ色（家計簿用） */
    .kcat-娯楽        { background: #dbeafe; color: #1e40af; }
    .kcat-昼食コンビニ { background: #fef9c3; color: #854d0e; }
    .kcat-昼食外食    { background: #fde68a; color: #92400e; }
    .kcat-夕食外食    { background: #ffedd5; color: #9a3412; }
    .kcat-スーパー    { background: #dcfce7; color: #166534; }
    .kcat-病院        { background: #ffe4e6; color: #be123c; }
    .kcat-水道代      { background: #e0f2fe; color: #0369a1; }
    .kcat-電気代      { background: #fef3c7; color: #92400e; }
    .kcat-ガス代      { background: #fee2e2; color: #991b1b; }
    .kcat-積立        { background: #f0fdf4; color: #166534; }
    .kcat-インターネット代 { background: #ede9fe; color: #5b21b6; }
    .kcat-家賃        { background: #fce7f3; color: #9d174d; }
    .kcat-振替        { background: #f3f4f6; color: #374151; }
    .kcat-その他      { background: #f3f4f6; color: #374151; }

    /* 手動編集モーダル */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 200;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-overlay.hidden { display: none; }
    .modal-box {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      width: calc(100% - 32px);
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    .modal-box h3 { font-size: 1rem; margin-bottom: 14px; }
    .modal-box label { font-size: 0.82rem; color: var(--muted); display: block; margin-bottom: 4px; }
    .modal-box input, .modal-box select {
      width: 100%; padding: 9px 12px;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 1rem; background: var(--bg); color: var(--text);
      margin-bottom: 12px; outline: none;
    }
    .modal-box input:focus, .modal-box select:focus { border-color: var(--primary); }
    .modal-buttons { display: flex; gap: 8px; }
    .btn-modal-save {
      flex: 1; padding: 10px; background: var(--primary); color: #fff;
      border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    }
    .btn-modal-cancel {
      flex: 1; padding: 10px; background: var(--bg); color: var(--text);
      border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.95rem; cursor: pointer;
    }
    .btn-modal-delete {
      padding: 10px 14px; background: none; color: var(--danger);
      border: 1.5px solid var(--danger); border-radius: 8px; font-size: 0.95rem; cursor: pointer;
    }

    .no-data {
      text-align: center;
      padding: 32px 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
  <!-- Chart.js (ローカル処理・外部にデータ送信なし) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<header>
  <h1>🏠 家事・家計管理</h1>
  <p id="today-date"></p>
</header>

<!-- ページナビゲーション -->
<nav class="page-nav">
  <button class="page-nav-btn active" data-page="kaji">🧹 家事管理</button>
  <button class="page-nav-btn" data-page="kakeibo">💴 家計簿</button>
</nav>

<main>
  <!-- 家事管理ページ -->
  <div id="page-kaji">
  <!-- カテゴリフィルタ -->
  <div class="category-tabs" id="category-tabs">
    <button class="tab-btn active" data-cat="すべて">すべて</button>
    <button class="tab-btn" data-cat="掃除">🧹 掃除</button>
    <button class="tab-btn" data-cat="洗濯">👕 洗濯</button>
    <button class="tab-btn" data-cat="料理">🍳 料理</button>
    <button class="tab-btn" data-cat="買い物">🛒 買い物</button>
    <button class="tab-btn" data-cat="その他">📝 その他</button>
  </div>

  <!-- タスク追加 -->
  <div class="add-form">
    <h2>タスクを追加</h2>
    <div class="form-row">
      <input type="text" id="task-input" placeholder="例: 風呂掃除" maxlength="50" />
      <select id="cat-select">
        <option value="掃除">🧹 掃除</option>
        <option value="洗濯">👕 洗濯</option>
        <option value="料理">🍳 料理</option>
        <option value="買い物">🛒 買い物</option>
        <option value="その他">📝 その他</option>
      </select>
    </div>
    <button class="btn-add" id="btn-add">＋ 追加する</button>
  </div>

  <!-- タスク一覧 -->
  <div class="section-header">
    <h2 id="list-title">未完了のタスク</h2>
    <span class="count-badge" id="todo-count">0</span>
  </div>
  <div class="task-list" id="task-list"></div>

  <!-- 完了済みトグル -->
  <div class="done-toggle" id="done-toggle">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
    完了済み（<span id="done-count">0</span>件）
  </div>
  <div class="task-list" id="done-list" style="display:none"></div>
  </div><!-- /page-kaji -->

  <!-- 家計簿ページ -->
  <div id="page-kakeibo">
    <!-- CSVインポート -->
    <div class="kakeibo-import">
      <p>クレジットカードの利用明細CSVを読み込みます。<br>データはこの端末のみで処理されます。</p>
      <button class="btn-import" id="btn-import">📂 CSVを読み込む</button>
      <input type="file" id="csv-file-input" accept=".csv" />
    </div>

    <!-- 月選択 -->
    <div class="kakeibo-month-selector" id="month-selector" style="display:none">
      <button class="month-nav-btn" id="btn-prev-month">‹</button>
      <span id="current-month-label"></span>
      <button class="month-nav-btn" id="btn-next-month">›</button>
    </div>

    <!-- カテゴリ別集計 -->
    <div class="kakeibo-summary" id="kakeibo-summary" style="display:none">
      <h2>カテゴリ別集計（タップで明細表示）</h2>
      <div class="summary-total" id="summary-total"></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin:12px auto;max-width:400px;">
        <div style="position:relative;width:220px;height:220px;">
          <canvas id="pie-chart"></canvas>
        </div>
        <div id="pie-legend" style="display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:13px;"></div>
      </div>
      <div class="summary-rows" id="summary-rows"></div>
    </div>

    <!-- 明細 -->
    <div class="kakeibo-detail" id="kakeibo-detail" style="display:none">
      <h2 id="detail-title">明細</h2>
      <div id="detail-list"></div>
    </div>

    <div class="no-data" id="kakeibo-empty">CSVを読み込むと集計が表示されます</div>
  </div><!-- /page-kakeibo -->

  <!-- 手動編集モーダル -->
  <div class="modal-overlay hidden" id="edit-modal">
    <div class="modal-box">
      <h3>明細を編集</h3>
      <label>店名・内容</label>
      <input type="text" id="edit-name" maxlength="50" />
      <label>金額（円）※マイナス可</label>
      <input type="number" id="edit-amount" />
      <label>カテゴリ</label>
      <select id="edit-category">
        <option>娯楽</option>
        <option>昼食コンビニ</option>
        <option>昼食外食</option>
        <option>夕食外食</option>
        <option>スーパー</option>
        <option>病院</option>
        <option>水道代</option>
        <option>電気代</option>
        <option>ガス代</option>
        <option>積立</option>
        <option>インターネット代</option>
        <option>家賃</option>
        <option>振替</option>
        <option>その他</option>
      </select>
      <div class="modal-buttons">
        <button class="btn-modal-delete" id="btn-modal-delete">削除</button>
        <button class="btn-modal-cancel" id="btn-modal-cancel">キャンセル</button>
        <button class="btn-modal-save" id="btn-modal-save">保存</button>
      </div>
    </div>
  </div>
</main>

<script>
// ============================================================
//  データ層 — ここを Firebase に差し替えると共有対応になります
//
//  【Firebase移行時の変更手順】
//  1. <head> に Firebase SDK の <script> タグを追加
//  2. Storage オブジェクト（下記）の load/save を
//     Firestore の getDocs/setDoc に置き換える
//  3. 認証が必要な場合は Auth モジュールを追加する
// ============================================================
const Storage = {
  KEY: 'kaji_tasks_v1',

  load() {
    try {
      return JSON.parse(localStorage.getItem(this.KEY)) || [];
    } catch {
      return [];
    }
  },

  save(tasks) {
    localStorage.setItem(this.KEY, JSON.stringify(tasks));
  }
};

// ============================================================
//  アプリ状態
// ============================================================
let tasks = Storage.load();
let currentCat = 'すべて';
let doneOpen = false;

// ============================================================
//  ユーティリティ
// ============================================================
function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function formatDate(iso) {
  const d = new Date(iso);
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

function today() {
  return new Date().toLocaleDateString('ja-JP', {
    year: 'numeric', month: 'long', day: 'numeric', weekday: 'short'
  });
}

// ============================================================
//  描画
// ============================================================
function render() {
  const filtered = currentCat === 'すべて'
    ? tasks
    : tasks.filter(t => t.category === currentCat);

  const todo = filtered.filter(t => !t.done);
  const done = filtered.filter(t => t.done);

  document.getElementById('todo-count').textContent = todo.length;
  document.getElementById('done-count').textContent = done.length;

  renderList('task-list', todo);
  renderList('done-list', done);
}

function renderList(containerId, items) {
  const container = document.getElementById(containerId);

  if (items.length === 0) {
    if (containerId === 'task-list') {
      container.innerHTML = `
        <div class="empty">
          <div class="icon">✨</div>
          <p>未完了のタスクはありません</p>
        </div>`;
    } else {
      container.innerHTML = '';
    }
    return;
  }

  container.innerHTML = items.map(t => `
    <div class="task-item ${t.done ? 'done' : ''}" data-id="${t.id}">
      <div class="task-check" onclick="toggleDone('${t.id}')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
          stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <div class="task-body">
        <div class="task-name">${escapeHtml(t.name)}</div>
        <div class="task-meta">
          <span class="cat-tag cat-${t.category}">${t.category}</span>
          <span class="task-date">${formatDate(t.createdAt)}</span>
        </div>
      </div>
      <button class="btn-delete" onclick="deleteTask('${t.id}')" aria-label="削除">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6l-1 14H6L5 6"></path>
          <path d="M10 11v6M14 11v6"></path>
          <path d="M9 6V4h6v2"></path>
        </svg>
      </button>
    </div>
  `).join('');
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ============================================================
//  操作
// ============================================================
function addTask() {
  const input = document.getElementById('task-input');
  const name = input.value.trim();
  if (!name) {
    input.focus();
    return;
  }
  const cat = document.getElementById('cat-select').value;

  // ============================================================
  //  【Firebase移行時】ここを Firestore の addDoc に置き換える
  //  例: await addDoc(collection(db, 'tasks'), { name, category: cat, done: false, createdAt: new Date() })
  // ============================================================
  tasks.unshift({
    id: genId(),
    name,
    category: cat,
    done: false,
    createdAt: new Date().toISOString()
  });

  Storage.save(tasks);
  input.value = '';
  input.focus();
  render();
}

function toggleDone(id) {
  // ============================================================
  //  【Firebase移行時】ここを Firestore の updateDoc に置き換える
  // ============================================================
  const task = tasks.find(t => t.id === id);
  if (task) {
    task.done = !task.done;
    Storage.save(tasks);
    render();
  }
}

function deleteTask(id) {
  // ============================================================
  //  【Firebase移行時】ここを Firestore の deleteDoc に置き換える
  // ============================================================
  tasks = tasks.filter(t => t.id !== id);
  Storage.save(tasks);
  render();
}

// ============================================================

const KAKEIBO_CATEGORIES = [

  { name: '娯楽',           color: '#3b82f6', keywords: ['シネマ', '映画', 'ゲーム', 'アミューズ', 'カラオケ', 'ボウリング', 'イオンシネマ', '駐車場', 'パーキング', 'ENEOS', 'Ｅｎｅｏｓ', 'エネオス', 'ガソリン', '洗車', 'オートバックス', 'イエローハット'] },
  { name: '昼食コンビニ',   color: '#fbbf24', keywords: ['セブン', 'ファミマ', 'ローソン', 'ミニストップ', 'デイリーヤマザキ'] },
  { name: '昼食外食',       color: '#f59e0b', keywords: ['マクドナルド', 'すき家', '吉野家', 'モスバーガー', 'ケンタッキー', 'サブウェイ', 'ほっともっと', '松屋'] },
  { name: '夕食外食',       color: '#f97316', keywords: ['ねぎし', 'バーミヤン', 'にくの助', 'デニーズ', 'ガスト', 'サイゼリヤ', 'レストラン', 'izakaya', '居酒屋', 'しゃぶ', 'やきにく', '焼肉', '寿司', 'すし', 'ラーメン'] },
  { name: 'スーパー',       color: '#22c55e', keywords: ['まいばすけっと', 'オーケー', 'イオン', '西友', 'ライフ', 'マルエツ', 'ヨークマート', 'ピアゴ', 'コープ', '高島屋', '島屋', 'ルミネ'] },
  { name: '病院',           color: '#f43f5e', keywords: ['クリニック', '病院', '薬局', 'ドラッグ', 'マツキヨ', 'ウエルシア', 'ツルハ', '調剤', 'ＡＲＴ', '医院', '歯科'] },
  { name: '水道代',         color: '#0ea5e9', keywords: ['水道', '上下水道'] },
  { name: '電気代',         color: '#eab308', keywords: ['電力', '東京電力', '関西電力', '中部電力', '電気'] },
  { name: 'ガス代',         color: '#ef4444', keywords: ['東京ガス', '大阪ガス', 'ガス'] },
  { name: '積立',           color: '#10b981', keywords: ['ベネフィット', '保険', '積立', '年金', '定期'] },
  { name: 'インターネット代',color: '#8b5cf6', keywords: ['ドコモ', 'au', 'ソフトバンク', 'ＳＯＦＴＢＡＮＫ', '楽天モバイル', 'ＮＴＴ', 'フレッツ', 'ビッグローブ', 'インターネット', 'Ｗｉ－Ｆｉ'] },
  { name: '家賃',           color: '#ec4899', keywords: [] }, // CSVには出ない・自動追加
];

function classifyCategory(name) {
  for (const cat of KAKEIBO_CATEGORIES) {
    if (cat.keywords.some(kw => name.includes(kw))) return cat.name;
  }
  return 'その他';
}

function categoryColor(name) {
  const cat = KAKEIBO_CATEGORIES.find(c => c.name === name);
  return cat ? cat.color : '#6b7280';
}

// ============================================================
//  家計簿 — データ層
// ============================================================
const KakeiboStorage = {
  KEY: 'kakeibo_records_v1',

  load() {
    try {
      return JSON.parse(localStorage.getItem(this.KEY)) || [];
    } catch { return []; }
  },

  save(records) {
    // 保存するのは日付・店名・金額・カテゴリのみ（氏名・会員番号は除外済み）
    localStorage.setItem(this.KEY, JSON.stringify(records));
  }
};

// ============================================================
//  家計簿 — CSV パース（Shift-JIS対応）
// ============================================================
function parseKakeiboCSV(buffer) {
  // Shift-JIS → UTF-8 デコード
  const decoder = new TextDecoder('shift-jis');
  const text = decoder.decode(buffer);
  const lines = text.split(/\r?\n/).filter(l => l.trim());

  const records = [];
  // 1行目はヘッダー行なのでスキップ
  for (let i = 1; i < lines.length; i++) {
    const cols = splitCSVLine(lines[i]);
    if (cols.length < 6) continue;

    const dateStr = cols[0].trim();   // ご利用日
    const name    = cols[2].trim();   // ご利用内容
    const amtRaw  = cols[5].trim();   // 金額

    if (!dateStr || !name || !amtRaw) continue;

    // 金額: カンマ・ダブルクォート・スペース除去・数値化
    const amtCleaned = amtRaw.replace(/"/g, '').replace(/,/g, '').trim();
    const amount = parseInt(amtCleaned, 10);
    if (isNaN(amount) || amount === 0) continue; // 0と変換失敗のみ除外

    records.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5) + i,
      date: dateStr,
      name: name,
      amount: amount,  // マイナスはマイナスのまま保存
      category: amount < 0 ? '振替' : classifyCategory(name)
    });
  }
  return records;
}

// CSVの1行をカンマ分割（ダブルクォート対応）
function splitCSVLine(line) {
  const result = [];
  let current = '';
  let inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      inQuote = !inQuote;
    } else if (ch === ',' && !inQuote) {
      result.push(current);
      current = '';
    } else {
      current += ch;
    }
  }
  result.push(current);
  return result;
}

// ============================================================
//  家計簿 — 状態
// ============================================================
let kakeiboRecords = KakeiboStorage.load();
let kakeiboMonths  = [];   // 存在する月リスト ["2026/07", "2026/06", ...]
let currentMonthIdx = 0;   // kakeiboMonths のインデックス
let selectedCategory = null;

function buildMonthList() {
  const monthSet = new Set(kakeiboRecords.map(r => r.date.slice(0, 7)));
  kakeiboMonths = Array.from(monthSet).sort().reverse(); // 新しい月順
}

// ============================================================
//  家計簿 — 描画
// ============================================================
function renderKakeibo() {
  const hasData = kakeiboRecords.length > 0;
  document.getElementById('kakeibo-empty').style.display = hasData ? 'none' : 'block';
  document.getElementById('month-selector').style.display = hasData ? 'flex' : 'none';
  document.getElementById('kakeibo-summary').style.display = hasData ? 'block' : 'none';

  if (!hasData) {
    document.getElementById('kakeibo-detail').style.display = 'none';
    return;
  }

  buildMonthList();
  if (currentMonthIdx >= kakeiboMonths.length) currentMonthIdx = 0;
  const month = kakeiboMonths[currentMonthIdx];
  document.getElementById('current-month-label').textContent =
    month.replace('/', '年') + '月';

  // 家賃を表示月に自動補完（まだなければ追加して保存）
  const hasRent = kakeiboRecords.some(r => r.category === '家賃' && r.date.startsWith(month));
  if (!hasRent) {
    kakeiboRecords.push({
      id: `rent_${month}`,
      date: `${month}/01`,
      name: '家賃',
      amount: 100000,
      category: '家賃'
    });
    kakeiboRecords.sort((a, b) => b.date.localeCompare(a.date));
    KakeiboStorage.save(kakeiboRecords);
  }

  // 当月レコード
  const monthRecords = kakeiboRecords.filter(r => r.date.startsWith(month));

  // カテゴリ別集計（振替は除外）
  const catMap = {};
  let totalAmt = 0;
  for (const r of monthRecords) {
    if (r.category === '振替') continue; // 合計・グラフから除外
    catMap[r.category] = (catMap[r.category] || 0) + r.amount;
    totalAmt += r.amount;
  }

  // 合計表示（マイナス対応）
  const totalSign = totalAmt < 0 ? '-' : '';
  document.getElementById('summary-total').textContent =
    `合計 ${totalSign}¥${Math.abs(totalAmt).toLocaleString()}`;

  const sortedCats = Object.entries(catMap).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]));

  // 円グラフ描画（支出のみ、プラス金額で描画）
  drawPieChart(sortedCats);

  // 棒グラフ（横棒）
  const maxAmt = Math.max(...sortedCats.map(([,v]) => Math.abs(v)), 1);
  document.getElementById('summary-rows').innerHTML = sortedCats.map(([cat, amt]) => {
    const pct = Math.round((Math.abs(amt) / maxAmt) * 100);
    const color = categoryColor(cat);
    const isActive = selectedCategory === cat ? 'active' : '';
    const sign = amt < 0 ? '-' : '';
    return `
      <div class="summary-row ${isActive}" data-cat="${escapeHtml(cat)}" onclick="selectCategory('${escapeHtml(cat)}')">
        <span class="summary-cat-label">${escapeHtml(cat)}</span>
        <div class="summary-bar-wrap">
          <div class="summary-bar" style="width:${pct}%;background:${color}"></div>
        </div>
        <span class="summary-amount" style="color:${amt < 0 ? 'var(--danger)' : 'inherit'}">${sign}¥${Math.abs(amt).toLocaleString()}</span>
      </div>`;
  }).join('');

  // 明細
  renderDetail(monthRecords);
}

let pieChartInstance = null;

function drawPieChart(sortedCats) {
  const positive = sortedCats.filter(([, v]) => v > 0);
  const total = positive.reduce((s, [, v]) => s + v, 0);
  if (total === 0) return;

  const labels = positive.map(([cat]) => cat);
  const data   = positive.map(([, amt]) => amt);
  const colors = positive.map(([cat]) => categoryColor(cat));

  const canvas = document.getElementById('pie-chart');

  // 既存インスタンスを破棄してから再生成
  if (pieChartInstance) {
    pieChartInstance.destroy();
    pieChartInstance = null;
  }

  pieChartInstance = new Chart(canvas, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: colors,
        borderColor: '#fff',
        borderWidth: 2,
        hoverOffset: 6,
      }]
    },
    options: {
      responsive: true,
      cutout: '58%',
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => {
              const pct = Math.round((ctx.raw / total) * 100);
              return ` ${ctx.label}  ¥${ctx.raw.toLocaleString()} (${pct}%)`;
            }
          }
        },
      },
      animation: { duration: 400 },
    },
  });

  // カスタム凡例を描画
  const legendEl = document.getElementById('pie-legend');
  legendEl.innerHTML = '';
  positive.forEach(([cat, amt], i) => {
    const pct = Math.round((amt / total) * 100);
    const item = document.createElement('div');
    item.style.cssText = 'display:flex;align-items:center;gap:5px;cursor:pointer;';
    item.innerHTML = `
      <span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${colors[i]};flex-shrink:0;"></span>
      <span>${cat} <strong>${pct}%</strong></span>
    `;
    // 凡例クリックでスライスのハイライト切り替え
    item.addEventListener('click', () => {
      const meta = pieChartInstance.getDatasetMeta(0);
      const arcEl = meta.data[i];
      arcEl.hidden = !arcEl.hidden;
      item.style.opacity = arcEl.hidden ? '0.4' : '1';
      pieChartInstance.update();
    });
    legendEl.appendChild(item);
  });
}

function selectCategory(cat) {
  selectedCategory = selectedCategory === cat ? null : cat;
  renderKakeibo();
}

function renderDetail(monthRecords) {
  const detailEl = document.getElementById('kakeibo-detail');
  const records = selectedCategory
    ? monthRecords.filter(r => r.category === selectedCategory)
    : monthRecords;

  if (records.length === 0) {
    detailEl.style.display = 'none';
    return;
  }

  detailEl.style.display = 'block';
  document.getElementById('detail-title').textContent =
    selectedCategory ? `${selectedCategory} の明細` : 'すべての明細';

  document.getElementById('detail-list').innerHTML = records.map(r => {
    const color = categoryColor(r.category);
    const sign = r.amount < 0 ? '-' : '';
    const isTransfer = r.category === '振替';
    const transferNote = isTransfer
      ? `<span style="font-size:11px;color:#9ca3af;margin-left:4px;">（参考）</span>`
      : '';
    return `
      <div class="detail-item" style="${isTransfer ? 'opacity:0.6;' : ''}">
        <span class="detail-date">${r.date.slice(5).replace('/', '/')}</span>
        <span class="detail-name">${escapeHtml(r.name)}${transferNote}</span>
        <span class="detail-cat-tag kcat-${escapeHtml(r.category)}" style="background:${color}22;color:${color}">${escapeHtml(r.category)}</span>
        <span class="detail-amount" style="color:${r.amount < 0 ? 'var(--danger)' : 'inherit'}">${sign}¥${Math.abs(r.amount).toLocaleString()}</span>
        <button class="btn-delete" style="flex-shrink:0" onclick="openEditModal('${escapeHtml(r.id || '')}')">✏️</button>
      </div>`;
  }).join('');
}

// ============================================================
//  家計簿 — 手動編集モーダル
// ============================================================
let editingRecordId = null;

function openEditModal(id) {
  const record = kakeiboRecords.find(r => r.id === id);
  if (!record) return;
  editingRecordId = id;
  document.getElementById('edit-name').value = record.name;
  document.getElementById('edit-amount').value = record.amount;
  document.getElementById('edit-category').value = record.category;
  document.getElementById('edit-modal').classList.remove('hidden');
}

document.getElementById('btn-modal-cancel').addEventListener('click', () => {
  document.getElementById('edit-modal').classList.add('hidden');
});

document.getElementById('btn-modal-save').addEventListener('click', () => {
  const record = kakeiboRecords.find(r => r.id === editingRecordId);
  if (!record) return;
  record.name     = document.getElementById('edit-name').value.trim() || record.name;
  record.amount   = parseInt(document.getElementById('edit-amount').value, 10) || record.amount;
  record.category = document.getElementById('edit-category').value;
  KakeiboStorage.save(kakeiboRecords);
  document.getElementById('edit-modal').classList.add('hidden');
  renderKakeibo();
});

document.getElementById('btn-modal-delete').addEventListener('click', () => {
  if (!confirm('この明細を削除しますか？')) return;
  kakeiboRecords = kakeiboRecords.filter(r => r.id !== editingRecordId);
  KakeiboStorage.save(kakeiboRecords);
  document.getElementById('edit-modal').classList.add('hidden');
  renderKakeibo();
});

// モーダル背景クリックで閉じる
document.getElementById('edit-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('edit-modal')) {
    document.getElementById('edit-modal').classList.add('hidden');
  }
});

// ============================================================
//  家計簿 — イベント
// ============================================================
document.getElementById('btn-import').addEventListener('click', () => {
  document.getElementById('csv-file-input').click();
});

document.getElementById('csv-file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const newRecords = parseKakeiboCSV(ev.target.result);
    if (newRecords.length === 0) {
      alert('読み込めるデータがありませんでした。\n対応フォーマット: ご利用日,データ処理日,ご利用内容,…');
      return;
    }
    // 重複を除いてマージ（同日・同店名・同金額）
    const existingKeys = new Set(kakeiboRecords.map(r => `${r.date}|${r.name}|${r.amount}`));
    const added = newRecords.filter(r => !existingKeys.has(`${r.date}|${r.name}|${r.amount}`));

    kakeiboRecords = [...kakeiboRecords, ...added].sort((a, b) => b.date.localeCompare(a.date));
    KakeiboStorage.save(kakeiboRecords);
    selectedCategory = null;
    currentMonthIdx = 0;
    renderKakeibo();
    alert(`${added.length}件を取り込みました。`);
  };
  reader.readAsArrayBuffer(file);
  e.target.value = ''; // 同じファイルを再選択できるようリセット
});

document.getElementById('btn-prev-month').addEventListener('click', () => {
  if (currentMonthIdx < kakeiboMonths.length - 1) {
    currentMonthIdx++;
    selectedCategory = null;
    renderKakeibo();
  }
});

document.getElementById('btn-next-month').addEventListener('click', () => {
  if (currentMonthIdx > 0) {
    currentMonthIdx--;
    selectedCategory = null;
    renderKakeibo();
  }
});

// 既存データがあれば初期描画
if (kakeiboRecords.length > 0) renderKakeibo();
</script>
