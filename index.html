<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4f86c6" />
  <title>家事管理</title>

  <!-- PWA用マニフェストリンク（後でmanifest.jsonを追加する場合はここを有効化） -->
  <!-- <link rel="manifest" href="manifest.json" /> -->

  <style>
    /* ===== リセット & ベース ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #4f86c6;
      --primary-dark: #3a6ea8;
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1a1a2e;
      --muted: #6b7280;
      --border: #e5e7eb;
      --danger: #ef4444;
      --success: #22c55e;
      --radius: 12px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Meiryo", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ===== ヘッダー ===== */
    header {
      background: var(--primary);
      color: #fff;
      padding: 16px 20px 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    header h1 { font-size: 1.3rem; font-weight: 700; }
    header p { font-size: 0.78rem; opacity: 0.85; margin-top: 2px; }

    /* ===== メインレイアウト ===== */
    main { max-width: 600px; margin: 0 auto; padding: 16px 16px 100px; }

    /* ===== カテゴリタブ ===== */
    .category-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 0 12px;
      scrollbar-width: none;
    }
    .category-tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      flex-shrink: 0;
      padding: 6px 16px;
      border-radius: 999px;
      border: 2px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
      font-weight: 500;
    }
    .tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* ===== タスク追加フォーム ===== */
    .add-form {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 16px;
    }
    .add-form h2 { font-size: 0.9rem; color: var(--muted); margin-bottom: 12px; }
    .form-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .form-row input, .form-row select {
      flex: 1;
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    .form-row input:focus, .form-row select:focus {
      border-color: var(--primary);
    }
    .form-row select { flex: 0 0 auto; min-width: 110px; }
    .btn-add {
      width: 100%;
      padding: 11px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-add:hover { background: var(--primary-dark); }
    .btn-add:active { transform: scale(0.98); }

    /* ===== タスクリスト ===== */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0 10px;
    }
    .section-header h2 { font-size: 1rem; font-weight: 700; }
    .count-badge {
      font-size: 0.75rem;
      background: var(--primary);
      color: #fff;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .task-list { display: flex; flex-direction: column; gap: 8px; }

    .task-item {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: opacity 0.2s;
    }
    .task-item.done { opacity: 0.5; }

    /* チェックボックス */
    .task-check {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      border: 2px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      background: var(--bg);
    }
    .task-item.done .task-check {
      background: var(--success);
      border-color: var(--success);
    }
    .task-check svg { display: none; }
    .task-item.done .task-check svg { display: block; }

    .task-body { flex: 1; min-width: 0; }
    .task-name {
      font-size: 0.98rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .task-item.done .task-name { text-decoration: line-through; }
    .task-meta {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      align-items: center;
    }
    .cat-tag {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    .task-date { font-size: 0.72rem; color: var(--muted); }

    .btn-delete {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.15s;
      flex-shrink: 0;
    }
    .btn-delete:hover { color: var(--danger); }

    /* 完了済みセクション */
    .done-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.85rem;
      cursor: pointer;
      padding: 8px 0;
      margin-top: 16px;
      border-top: 1px solid var(--border);
      user-select: none;
    }
    .done-toggle svg { transition: transform 0.2s; }
    .done-toggle.open svg { transform: rotate(90deg); }

    /* 空状態 */
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }
    .empty .icon { font-size: 3rem; margin-bottom: 12px; }
    .empty p { font-size: 0.9rem; }

    /* カテゴリ色 */
    .cat-掃除  { background: #fef3c7; color: #92400e; }
    .cat-洗濯  { background: #dbeafe; color: #1e40af; }
    .cat-料理  { background: #dcfce7; color: #166534; }
    .cat-買い物 { background: #fce7f3; color: #9d174d; }
    .cat-その他 { background: #f3f4f6; color: #374151; }
  </style>
</head>
<body>

<header>
  <h1>🏠 家事管理</h1>
  <p id="today-date"></p>
</header>

<main>
  <!-- カテゴリフィルタ -->
  <div class="category-tabs" id="category-tabs">
    <button class="tab-btn active" data-cat="すべて">すべて</button>
    <button class="tab-btn" data-cat="掃除">🧹 掃除</button>
    <button class="tab-btn" data-cat="洗濯">👕 洗濯</button>
    <button class="tab-btn" data-cat="料理">🍳 料理</button>
    <button class="tab-btn" data-cat="買い物">🛒 買い物</button>
    <button class="tab-btn" data-cat="その他">📝 その他</button>
  </div>

  <!-- タスク追加 -->
  <div class="add-form">
    <h2>タスクを追加</h2>
    <div class="form-row">
      <input type="text" id="task-input" placeholder="例: 風呂掃除" maxlength="50" />
      <select id="cat-select">
        <option value="掃除">🧹 掃除</option>
        <option value="洗濯">👕 洗濯</option>
        <option value="料理">🍳 料理</option>
        <option value="買い物">🛒 買い物</option>
        <option value="その他">📝 その他</option>
      </select>
    </div>
    <button class="btn-add" id="btn-add">＋ 追加する</button>
  </div>

  <!-- タスク一覧 -->
  <div class="section-header">
    <h2 id="list-title">未完了のタスク</h2>
    <span class="count-badge" id="todo-count">0</span>
  </div>
  <div class="task-list" id="task-list"></div>

  <!-- 完了済みトグル -->
  <div class="done-toggle" id="done-toggle">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
    完了済み（<span id="done-count">0</span>件）
  </div>
  <div class="task-list" id="done-list" style="display:none"></div>
</main>

<script>
// ============================================================
//  データ層 — ここを Firebase に差し替えると共有対応になります
//
//  【Firebase移行時の変更手順】
//  1. <head> に Firebase SDK の <script> タグを追加
//  2. Storage オブジェクト（下記）の load/save を
//     Firestore の getDocs/setDoc に置き換える
//  3. 認証が必要な場合は Auth モジュールを追加する
// ============================================================
const Storage = {
  KEY: 'kaji_tasks_v1',

  load() {
    try {
      return JSON.parse(localStorage.getItem(this.KEY)) || [];
    } catch {
      return [];
    }
  },

  save(tasks) {
    localStorage.setItem(this.KEY, JSON.stringify(tasks));
  }
};

// ============================================================
//  アプリ状態
// ============================================================
let tasks = Storage.load();
let currentCat = 'すべて';
let doneOpen = false;

// ============================================================
//  ユーティリティ
// ============================================================
function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function formatDate(iso) {
  const d = new Date(iso);
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

function today() {
  return new Date().toLocaleDateString('ja-JP', {
    year: 'numeric', month: 'long', day: 'numeric', weekday: 'short'
  });
}

// ============================================================
//  描画
// ============================================================
function render() {
  const filtered = currentCat === 'すべて'
    ? tasks
    : tasks.filter(t => t.category === currentCat);

  const todo = filtered.filter(t => !t.done);
  const done = filtered.filter(t => t.done);

  document.getElementById('todo-count').textContent = todo.length;
  document.getElementById('done-count').textContent = done.length;

  renderList('task-list', todo);
  renderList('done-list', done);
}

function renderList(containerId, items) {
  const container = document.getElementById(containerId);

  if (items.length === 0) {
    if (containerId === 'task-list') {
      container.innerHTML = `
        <div class="empty">
          <div class="icon">✨</div>
          <p>未完了のタスクはありません</p>
        </div>`;
    } else {
      container.innerHTML = '';
    }
    return;
  }

  container.innerHTML = items.map(t => `
    <div class="task-item ${t.done ? 'done' : ''}" data-id="${t.id}">
      <div class="task-check" onclick="toggleDone('${t.id}')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
          stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <div class="task-body">
        <div class="task-name">${escapeHtml(t.name)}</div>
        <div class="task-meta">
          <span class="cat-tag cat-${t.category}">${t.category}</span>
          <span class="task-date">${formatDate(t.createdAt)}</span>
        </div>
      </div>
      <button class="btn-delete" onclick="deleteTask('${t.id}')" aria-label="削除">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6l-1 14H6L5 6"></path>
          <path d="M10 11v6M14 11v6"></path>
          <path d="M9 6V4h6v2"></path>
        </svg>
      </button>
    </div>
  `).join('');
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ============================================================
//  操作
// ============================================================
function addTask() {
  const input = document.getElementById('task-input');
  const name = input.value.trim();
  if (!name) {
    input.focus();
    return;
  }
  const cat = document.getElementById('cat-select').value;

  // ============================================================
  //  【Firebase移行時】ここを Firestore の addDoc に置き換える
  //  例: await addDoc(collection(db, 'tasks'), { name, category: cat, done: false, createdAt: new Date() })
  // ============================================================
  tasks.unshift({
    id: genId(),
    name,
    category: cat,
    done: false,
    createdAt: new Date().toISOString()
  });

  Storage.save(tasks);
  input.value = '';
  input.focus();
  render();
}

function toggleDone(id) {
  // ============================================================
  //  【Firebase移行時】ここを Firestore の updateDoc に置き換える
  // ============================================================
  const task = tasks.find(t => t.id === id);
  if (task) {
    task.done = !task.done;
    Storage.save(tasks);
    render();
  }
}

function deleteTask(id) {
  // ============================================================
  //  【Firebase移行時】ここを Firestore の deleteDoc に置き換える
  // ============================================================
  tasks = tasks.filter(t => t.id !== id);
  Storage.save(tasks);
  render();
}

// ============================================================
//  イベント登録
// ============================================================

// 追加ボタン
document.getElementById('btn-add').addEventListener('click', addTask);

// Enterキーで追加
document.getElementById('task-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTask();
});

// カテゴリタブ
document.getElementById('category-tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentCat = btn.dataset.cat;
  render();
});

// 完了済みトグル
document.getElementById('done-toggle').addEventListener('click', () => {
  doneOpen = !doneOpen;
  document.getElementById('done-list').style.display = doneOpen ? 'flex' : 'none';
  document.getElementById('done-list').style.flexDirection = 'column';
  document.getElementById('done-list').style.gap = '8px';
  document.getElementById('done-toggle').classList.toggle('open', doneOpen);
});

// ============================================================
//  初期化
// ============================================================
document.getElementById('today-date').textContent = today();
render();
</script>

</body>
</html>
