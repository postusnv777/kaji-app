<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4f86c6" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon/20260515_105329.jpg" />
  <link rel="apple-touch-icon" href="icon/20260515_105329.jpg" />
  <title>家事・家計管理</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --kaji-primary: #4f86c6; --kaji-dark: #3a6ea8;
      --kakeibo-primary: #f97316; --kakeibo-dark: #ea6c0a;
      --bg: #f4f6fb; --card: #ffffff; --text: #1a1a2e;
      --muted: #6b7280; --border: #e5e7eb;
      --danger: #ef4444; --success: #22c55e;
      --radius: 12px; --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Meiryo", sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100dvh; overflow-x: hidden;
      padding-bottom: env(safe-area-inset-bottom);
    }
    header {
      background: var(--kaji-primary); color: #fff;
      padding: 14px 20px 0; position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15); transition: background 0.3s;
    }
    header h1 { font-size: 1.2rem; font-weight: 700; padding-bottom: 4px; }
    .top-nav { display: flex; }
    .top-nav-btn {
      flex: 1; padding: 10px 8px; background: none; border: none;
      color: rgba(255,255,255,0.6); font-size: 0.9rem; font-weight: 700;
      cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.15s;
    }
    .top-nav-btn.active { color: #fff; border-bottom-color: #fff; }
    .sub-nav {
      display: flex; background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 62px; z-index: 90;
    }
    .sub-nav-btn {
      flex: 1; padding: 10px 8px; background: none;
      border: none; border-bottom: 3px solid transparent;
      color: var(--muted); font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }
    .sub-nav-btn.active { color: var(--kaji-primary); border-bottom-color: var(--kaji-primary); }
    main { max-width: 600px; margin: 0 auto; padding: 16px 16px 100px; overflow-x: hidden; }
    .page { display: none; } .page.active { display: block; }
    .kaji-tab { display: none; } .kaji-tab.active { display: block; }
    .card {
      background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px;
    }
    /* 家事タスク */
    .today-heading { font-size: 1rem; font-weight: 700; color: var(--kaji-primary); margin-bottom: 14px; }
    .task-item {
      background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 13px 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
    }
    .task-item.done { opacity: 0.45; }
    .task-check {
      width: 26px; height: 26px; flex-shrink: 0; border: 2px solid var(--border);
      border-radius: 50%; cursor: pointer; display: flex; align-items: center;
      justify-content: center; background: var(--bg); transition: all 0.15s;
    }
    .task-item.done .task-check { background: var(--success); border-color: var(--success); }
    .task-check svg, .week-check svg { display: none; }
    .task-item.done .task-check svg { display: block; }
    .task-body { flex: 1; min-width: 0; }
    .task-name { font-size: 0.95rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task-item.done .task-name { text-decoration: line-through; }
    .task-sub { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
    .cat-tag { font-size: 0.68rem; padding: 2px 7px; border-radius: 999px; font-weight: 600; flex-shrink: 0; }
    .cat-掃除  { background:#fef3c7; color:#92400e; }
    .cat-洗濯  { background:#dbeafe; color:#1e40af; }
    .cat-料理  { background:#dcfce7; color:#166534; }
    .cat-買い物 { background:#fce7f3; color:#9d174d; }
    .cat-その他 { background:#f3f4f6; color:#374151; }
    .empty-state { text-align:center; padding:40px 16px; color:var(--muted); }
    .empty-state .icon { font-size:2.2rem; margin-bottom:8px; }
    /* 今週タブ */
    .week-day-label {
      font-size: 0.82rem; font-weight: 700; padding: 5px 10px;
      border-radius: 8px; margin-bottom: 6px; background: var(--border); color: var(--text);
      display: inline-block;
    }
    .week-day-label.today { background: var(--kaji-primary); color: #fff; }
    .week-day-section { margin-bottom: 14px; }
    .week-task-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; background: var(--card); border-radius: 8px;
      box-shadow: var(--shadow); margin-bottom: 5px;
    }
    .week-task-row.done { opacity: 0.4; }
    .week-check {
      width: 20px; height: 20px; flex-shrink: 0; border: 2px solid var(--border);
      border-radius: 50%; cursor: pointer; display: flex; align-items: center;
      justify-content: center; background: var(--bg); transition: all 0.15s;
    }
    .week-task-row.done .week-check { background: var(--success); border-color: var(--success); }
    .week-task-row.done .week-check svg { display: block; }
    .week-task-name { flex: 1; font-size: 0.88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .week-task-row.done .week-task-name { text-decoration: line-through; }
    /* 設定タブ */
    .btn-add-task {
      width: 100%; padding: 12px; background: var(--kaji-primary); color: #fff;
      border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; margin-bottom: 16px;
    }
    .schedule-item {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 14px; background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow); margin-bottom: 8px;
    }
    .schedule-info { flex: 1; min-width: 0; }
    .schedule-name { font-size: 0.92rem; font-weight: 600; }
    .schedule-detail { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
    .btn-edit-sch {
      background: none; border: 1.5px solid var(--border); border-radius: 8px;
      padding: 5px 10px; font-size: 0.8rem; cursor: pointer; color: var(--muted); flex-shrink: 0;
    }
    /* モーダル共通 */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      z-index: 200; display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-overlay.hidden { display: none; }
    .modal-box {
      background: var(--card); border-radius: var(--radius); padding: 20px;
      width: 100%; max-width: 420px; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      max-height: 88vh; overflow-y: auto;
    }
    .modal-box h3 { font-size: 1rem; margin-bottom: 12px; }
    .modal-box label { font-size: 0.8rem; color: var(--muted); display: block; margin: 10px 0 4px; }
    .modal-box input, .modal-box select {
      width: 100%; padding: 9px 12px; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 1rem; background: var(--bg); color: var(--text); outline: none;
    }
    .modal-box input:focus, .modal-box select:focus { border-color: var(--kaji-primary); }
    .weekday-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    .wd-btn {
      padding: 6px 10px; border-radius: 999px; border: 1.5px solid var(--border);
      background: var(--bg); font-size: 0.82rem; cursor: pointer; transition: all 0.12s;
    }
    .wd-btn.selected { background: var(--kaji-primary); color: #fff; border-color: var(--kaji-primary); }
    .modal-buttons { display: flex; gap: 8px; margin-top: 16px; }
    .btn-ms { flex:1; padding:10px; background:var(--kaji-primary); color:#fff; border:none; border-radius:8px; font-size:0.95rem; font-weight:600; cursor:pointer; }
    .btn-mc { flex:1; padding:10px; background:var(--bg); color:var(--text); border:1.5px solid var(--border); border-radius:8px; font-size:0.95rem; cursor:pointer; }
    .btn-md { padding:10px 14px; background:none; color:var(--danger); border:1.5px solid var(--danger); border-radius:8px; font-size:0.95rem; cursor:pointer; }
    /* 家計簿 */
    .kakeibo-import {
      background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 16px; margin-bottom: 16px; text-align: center;
    }
    .kakeibo-import p { font-size: 0.82rem; color: var(--muted); margin-bottom: 12px; }
    .btn-import {
      display: inline-block; padding: 10px 24px; background: var(--kakeibo-primary); color: #fff;
      border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    }
    .btn-import:active { transform: scale(0.97); }
    #csv-file-input { display: none; }
    .btn-reset {
      display: inline-block; margin-top: 8px; padding: 7px 18px;
      background: transparent; color: var(--danger); border: 1px solid var(--danger);
      border-radius: 8px; font-size: 0.85rem; cursor: pointer;
    }
    .kakeibo-month-selector {
      display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 16px;
    }
    .month-nav-btn {
      background: var(--card); border: 1.5px solid var(--border); border-radius: 8px;
      width: 36px; height: 36px; font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #current-month-label { font-size: 1rem; font-weight: 700; min-width: 100px; text-align: center; }
    .kakeibo-summary { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
    .kakeibo-summary h2 { font-size: 0.9rem; color: var(--muted); margin-bottom: 12px; }
    .summary-total { font-size: 1.4rem; font-weight: 700; text-align: center; margin-bottom: 14px; color: var(--kakeibo-dark); }
    .summary-rows { display: flex; flex-direction: column; gap: 6px; }
    .summary-row {
      display: flex; align-items: center; gap: 8px; cursor: pointer;
      padding: 6px 8px; border-radius: 8px; transition: background 0.1s;
    }
    .summary-row:hover, .summary-row.active { background: var(--bg); }
    .summary-cat-label { font-size: 0.88rem; font-weight: 500; min-width: 80px; }
    .summary-bar-wrap { flex: 1; height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; min-width: 0; }
    .summary-bar { height: 100%; border-radius: 999px; transition: width 0.3s; }
    .summary-amount { font-size: 0.85rem; font-weight: 600; min-width: 76px; text-align: right; white-space: nowrap; }
    .kakeibo-detail { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
    .kakeibo-detail h2 { font-size: 0.9rem; color: var(--muted); margin-bottom: 10px; }
    .detail-item {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem;
      flex-wrap: wrap;
    }
    .detail-item:last-child { border-bottom: none; }
    .detail-date { color: var(--muted); min-width: 44px; flex-shrink: 0; }
    .detail-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 80px; }
    .detail-amount { font-weight: 600; min-width: 70px; text-align: right; white-space: nowrap; }
    .detail-cat-tag { font-size: 0.68rem; padding: 2px 6px; border-radius: 999px; font-weight: 600; flex-shrink: 0; }
    .btn-delete {
      background: none; border: none; color: var(--muted); cursor: pointer;
      padding: 4px; border-radius: 6px; flex-shrink: 0;
    }
    .btn-delete:hover { color: var(--danger); }
    .kcat-外食        { background:#ffedd5; color:#9a3412; }
    .kcat-娯楽        { background:#dbeafe; color:#1e40af; }
    .kcat-車          { background:#f1f5f9; color:#475569; }
    .kcat-スーパー    { background:#dcfce7; color:#166534; }
    .kcat-病院        { background:#ffe4e6; color:#be123c; }
    .kcat-水道代      { background:#e0f2fe; color:#0369a1; }
    .kcat-電気代      { background:#fef3c7; color:#92400e; }
    .kcat-ガス代      { background:#fee2e2; color:#991b1b; }
    .kcat-積立        { background:#f0fdf4; color:#166534; }
    .kcat-インターネット代 { background:#ede9fe; color:#5b21b6; }
    .kcat-家賃        { background:#fce7f3; color:#9d174d; }
    .kcat-振替        { background:#f3f4f6; color:#374151; }
    .kcat-その他      { background:#f3f4f6; color:#374151; }
    .modal-kakeibo input:focus, .modal-kakeibo select:focus { border-color: var(--kakeibo-primary); }
    .btn-ms-kakeibo { flex:1; padding:10px; background:var(--kakeibo-primary); color:#fff; border:none; border-radius:8px; font-size:0.95rem; font-weight:600; cursor:pointer; }
    .no-data { text-align:center; padding:32px 20px; color:var(--muted); font-size:0.9rem; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

<!-- ログイン画面 -->
<div id="login-screen" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:20px;">
  <h1 style="font-size:2rem;margin-bottom:8px;">🏠</h1>
  <h2 style="font-size:1.2rem;margin-bottom:24px;color:#1a1a2e;">家事・家計管理</h2>
  <button id="btn-login" style="padding:12px 32px;background:#4285f4;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.15);">
    Googleでログイン
  </button>
  <p id="login-error" style="color:#ef4444;font-size:0.85rem;margin-top:12px;display:none;"></p>
</div>

<!-- メインアプリ（ログイン後に表示） -->
<div id="app-main" style="display:none;">

<header id="app-header">
  <h1 id="header-title">🏠 家事・家計管理</h1>
  <nav class="top-nav">
    <button class="top-nav-btn active" data-app="kaji">🧹 家事管理</button>
    <button class="top-nav-btn" data-app="kakeibo">💴 家計簿</button>
  </nav>
</header>

<!-- 家事管理サブナビ -->
<nav class="sub-nav" id="kaji-sub-nav">
  <button class="sub-nav-btn active" data-tab="today">今日</button>
  <button class="sub-nav-btn" data-tab="week">今週</button>
  <button class="sub-nav-btn" data-tab="settings">設定</button>
</nav>

<main>
  <!-- ===== 家事管理ページ ===== -->
  <div id="page-kaji" class="page active">

    <!-- 今日タブ -->
    <div id="tab-today" class="kaji-tab active">
      <div class="today-heading" id="today-heading"></div>
      <div id="today-list"></div>
    </div>

    <!-- 今週タブ -->
    <div id="tab-week" class="kaji-tab">
      <div id="week-list"></div>
    </div>

    <!-- 設定タブ -->
    <div id="tab-settings" class="kaji-tab">
      <div class="card" style="margin-bottom:16px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
          <h4 style="font-size:0.95rem;font-weight:700;color:var(--kaji-primary);">👥 メンバー管理</h4>
        </div>
        <div id="member-list" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;"></div>
        <div style="display:flex;gap:8px;">
          <input type="text" id="new-member-name" maxlength="10" placeholder="名前を入力" style="flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:0.85rem;" />
          <button id="btn-add-member" style="padding:8px 16px;background:var(--kaji-primary);color:#fff;border:none;border-radius:8px;font-size:0.85rem;cursor:pointer;white-space:nowrap;">追加</button>
        </div>
      </div>
      <button class="btn-add-task" id="btn-add-schedule">＋ タスクを追加</button>
      <div id="schedule-list"></div>
    </div>
  </div>

  <!-- ===== 家計簿ページ ===== -->
  <div id="page-kakeibo" class="page">
    <div class="kakeibo-import">
      <p>クレジットカードの利用明細CSVを読み込みます。<br>データはこの端末のみで処理されます。</p>
      <button class="btn-import" id="btn-import">📂 CSVを読み込む</button>
      <input type="file" id="csv-file-input" accept=".csv" />
      <br>
      <button class="btn-reset" id="btn-reset">🗑️ 全データをリセット</button>
      <button id="btn-classify-settings" style="display:inline-block;margin-top:8px;margin-left:8px;padding:7px 18px;background:transparent;color:var(--kakeibo-primary);border:1px solid var(--kakeibo-primary);border-radius:8px;font-size:0.85rem;cursor:pointer;">⚙️ 分類設定</button>
      <button id="btn-reclassify" style="display:inline-block;margin-top:8px;margin-left:8px;padding:7px 18px;background:transparent;color:var(--kakeibo-primary);border:1px solid var(--kakeibo-primary);border-radius:8px;font-size:0.85rem;cursor:pointer;">🔄 再分類</button>
    </div>
    <div class="kakeibo-month-selector" id="month-selector" style="display:none">
      <button class="month-nav-btn" id="btn-prev-month">‹</button>
      <span id="current-month-label"></span>
      <button class="month-nav-btn" id="btn-next-month">›</button>
    </div>
    <div class="kakeibo-summary" id="kakeibo-summary" style="display:none">
      <h2>カテゴリ別集計（タップで明細表示）</h2>
      <div class="summary-total" id="summary-total"></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin:12px auto;max-width:400px;">
        <div style="position:relative;width:220px;height:220px;">
          <canvas id="pie-chart"></canvas>
        </div>
        <div id="pie-legend" style="display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:13px;"></div>
      </div>
      <div class="summary-rows" id="summary-rows"></div>
    </div>
    <div class="kakeibo-detail" id="kakeibo-detail" style="display:none">
      <h2 id="detail-title">明細</h2>
      <div id="detail-list"></div>
    </div>
    <div class="no-data" id="kakeibo-empty">CSVを読み込むと集計が表示されます</div>
  </div>
</main>

<!-- スケジュール追加/編集モーダル -->
<div class="modal-overlay hidden" id="schedule-modal">
  <div class="modal-box">
    <h3 id="schedule-modal-title">タスクを追加</h3>
    <label>タスク名</label>
    <input type="text" id="sch-name" maxlength="30" placeholder="例: 風呂掃除" />
    <label>カテゴリ</label>
    <select id="sch-category">
      <option>掃除</option><option>洗濯</option><option>料理</option>
      <option>買い物</option><option>その他</option>
    </select>
    <label>頻度</label>
    <select id="sch-frequency">
      <option value="weekly">週次（曜日指定）</option>
      <option value="monthly">月次（日付指定）</option>
    </select>
    <div id="sch-weekday-section">
      <label>曜日（複数可）</label>
      <div class="weekday-btns" id="sch-weekday-btns">
        <button type="button" class="wd-btn" data-wd="0">日</button>
        <button type="button" class="wd-btn" data-wd="1">月</button>
        <button type="button" class="wd-btn" data-wd="2">火</button>
        <button type="button" class="wd-btn" data-wd="3">水</button>
        <button type="button" class="wd-btn" data-wd="4">木</button>
        <button type="button" class="wd-btn" data-wd="5">金</button>
        <button type="button" class="wd-btn" data-wd="6">土</button>
      </div>
    </div>
    <div id="sch-monthday-section" style="display:none">
      <label>日付（毎月何日）</label>
      <input type="number" id="sch-monthday" min="1" max="28" placeholder="1〜28" />
    </div>
    <label>担当者</label>
    <select id="sch-assignee">
      <option value="">未設定</option>
    </select>
    <div class="modal-buttons">
      <button class="btn-md" id="btn-sch-delete" style="display:none">削除</button>
      <button class="btn-mc" id="btn-sch-cancel">キャンセル</button>
      <button class="btn-ms" id="btn-sch-save">保存</button>
    </div>
  </div>
</div>

<!-- 家計簿明細編集モーダル -->
<div class="modal-overlay hidden modal-kakeibo" id="edit-modal">
  <div class="modal-box">
    <h3>明細を編集</h3>
    <label>店名・内容</label>
    <input type="text" id="edit-name" maxlength="50" />
    <label>金額</label>
    <input type="number" id="edit-amount" />
    <label>カテゴリ</label>
    <select id="edit-category">
      <option>外食</option><option>娯楽</option><option>車</option>
      <option>スーパー</option><option>病院</option>
      <option>水道代</option><option>電気代</option><option>ガス代</option>
      <option>積立</option><option>インターネット代</option><option>家賃</option>
      <option>振替</option><option>その他</option>
    </select>
    <div class="modal-buttons">
      <button class="btn-md" id="btn-modal-delete">削除</button>
      <button class="btn-mc" id="btn-modal-cancel">キャンセル</button>

<script>

// ============================================================

function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function todayStr() {

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ============================================================
//  Firebase 初期化
// ============================================================
const firebaseConfig = {

  appId: "1:418084439735:web:2aa9f697a54e99f2f22f32"
};
firebase.initializeApp(firebaseConfig);

const ALLOWED_EMAILS = ['post.usnv777@gmail.com', 'g1712060@gmail.com'];

document.getElementById('btn-login').addEventListener('click', async () => {

// リダイレクト後の結果処理
auth.getRedirectResult().then(result => {

let appInitialized = false;
async function initApp() {
  if (appInitialized) return;
  appInitialized = true;
  // メンバー読み込み＆自動登録
  kajiMembers = await MemberStorage.load();
  await autoRegisterMember();

// ============================================================
//  家事管理 — データ層
// ============================================================
const KAJI_SCH_DOC  = db.collection('kaji').doc('schedules');
const KAJI_COMP_DOC = db.collection('kaji').doc('completions');
const KAJI_MEMBERS_DOC = db.collection('kaji').doc('members');

let kajiMembers = []; // [{name: '太郎'}, ...]

const MemberStorage = {
  LS_KEY: 'kaji_members_v1',
  async load() {
    try {
      const snap = await KAJI_MEMBERS_DOC.get();
      if (snap.exists) {
        const data = snap.data().list || [];
        localStorage.setItem(this.LS_KEY, JSON.stringify(data));
        return data;
      }
      return JSON.parse(localStorage.getItem(this.LS_KEY)) || [];
    } catch(e) {
      return JSON.parse(localStorage.getItem(this.LS_KEY)) || [];
    }
  },
  async save(list) {
    localStorage.setItem(this.LS_KEY, JSON.stringify(list));
    try { await KAJI_MEMBERS_DOC.set({ list, updatedAt: new Date() }); } catch(e){}
  }
};

async function autoRegisterMember() {
  const user = auth.currentUser;
  if (!user || !user.displayName) return;
  const name = user.displayName;
  if (!kajiMembers.some(m => m.name === name)) {
    kajiMembers.push({ name });
    await MemberStorage.save(kajiMembers);
    renderMembers();
    updateAssigneeOptions();
  }
}

const KajiStorage = {
  SCH_KEY:  'kaji_schedules_v1',
  COMP_KEY: 'kaji_completions_v1',

  async loadSchedules() {
    try {
      const snap = await KAJI_SCH_DOC.get();
      if (snap.exists) {
        const data = snap.data().list || [];
        localStorage.setItem(this.SCH_KEY, JSON.stringify(data));
        return data;
      }
      return JSON.parse(localStorage.getItem(this.SCH_KEY)) || [];
    } catch(e) {
      return JSON.parse(localStorage.getItem(this.SCH_KEY)) || [];
    }
  },
  async saveSchedules(list) {
    localStorage.setItem(this.SCH_KEY, JSON.stringify(list));
    try { await KAJI_SCH_DOC.set({ list, updatedAt: new Date() }); } catch(e){}
  },
  async loadCompletions() {
    try {
      const snap = await KAJI_COMP_DOC.get();
      if (snap.exists) {
        let data = snap.data().list || [];
        // 90日以上古いものを削除
        const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 90);
        data = data.filter(c => new Date(c.date) >= cutoff);
        localStorage.setItem(this.COMP_KEY, JSON.stringify(data));
        return data;
      }
      return JSON.parse(localStorage.getItem(this.COMP_KEY)) || [];
    } catch(e) {
      return JSON.parse(localStorage.getItem(this.COMP_KEY)) || [];
    }
  },
  async saveCompletions(list) {
    localStorage.setItem(this.COMP_KEY, JSON.stringify(list));
    try { await KAJI_COMP_DOC.set({ list, updatedAt: new Date() }); } catch(e){}
  }
};

// ============================================================
//  家事管理 — 状態
// ============================================================
let kajiSchedules   = [];  // スケジュールマスタ
let kajiCompletions = [];  // 完了履歴
let editingScheduleId = null;

// ============================================================
//  家事管理 — ヘルパー
// ============================================================
const WEEKDAY_NAMES = ['日','月','火','水','木','金','土'];

function getWeekDates() {
  // 今週月曜から日曜まで（月曜始まり）
  const today = new Date();
  const day = today.getDay(); // 0=日
  const monday = new Date(today);
  monday.setDate(today.getDate() - (day === 0 ? 6 : day - 1));
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    dates.push(d);
  }
  return dates;
}

function getSchedulesForDate(date) {
  const wd = date.getDay();
  const day = date.getDate();
  const dateStr = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  return kajiSchedules.filter(s => {
    if (s.frequency === 'weekly') return s.weekdays && s.weekdays.includes(wd);
    if (s.frequency === 'monthly') return s.monthDay === day;
    return false;
  }).map(s => {
    const completion = kajiCompletions.find(c => c.scheduleId === s.id && c.date === dateStr);
    return {
      ...s,
      dateStr,
      done: !!completion,
      completedBy: completion ? (completion.completedBy || '') : ''
    };
  });
}

async function toggleCompletion(scheduleId, dateStr) {
  const idx = kajiCompletions.findIndex(c => c.scheduleId === scheduleId && c.date === dateStr);
  if (idx >= 0) {
    kajiCompletions.splice(idx, 1);
  } else {
    const user = auth.currentUser;
    const completedBy = user ? (user.displayName || user.email) : '';
    kajiCompletions.push({ id: genId(), scheduleId, date: dateStr, completedBy });
  }
  await KajiStorage.saveCompletions(kajiCompletions);
}

// ============================================================
//  家事管理 — 描画
// ============================================================
function renderToday() {
  const today = new Date();
  const todayDateStr = todayStr();
  const wd = today.getDay();
  const tasks = getSchedulesForDate(today);

  document.getElementById('today-heading').textContent =
    `${today.getMonth()+1}月${today.getDate()}日（${WEEKDAY_NAMES[wd]}）`;

  if (tasks.length === 0) {
    document.getElementById('today-list').innerHTML =
      `<div class="empty-state"><div class="icon">✨</div><p>今日の家事はありません</p></div>`;
    return;
  }

  const todo = tasks.filter(t => !t.done);
  const done = tasks.filter(t => t.done);
  const checkSvg = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

  const renderItem = t => {
    const assigneeTag = t.assignee ? `<span style="font-size:0.7rem;color:var(--kaji-primary);margin-left:4px;">👤${escapeHtml(t.assignee)}</span>` : '';
    const completedByTag = t.done && t.completedBy ? `<span style="font-size:0.7rem;color:var(--success);margin-left:4px;">✓${escapeHtml(t.completedBy)}</span>` : '';
    return `
    <div class="task-item ${t.done ? 'done' : ''}" id="task-${t.id}">
      <div class="task-check" onclick="onToggleToday('${t.id}','${t.dateStr}')">
        ${checkSvg}
      </div>
      <div class="task-body">
        <div class="task-name">${escapeHtml(t.name)}</div>
        <div class="task-sub">${t.frequency === 'weekly' ? t.weekdays.map(w=>WEEKDAY_NAMES[w]).join('・')+'曜' : `毎月${t.monthDay}日`}${assigneeTag}${completedByTag}</div>
      </div>
      <span class="cat-tag cat-${escapeHtml(t.category)}">${escapeHtml(t.category)}</span>
    </div>`;
  };

  document.getElementById('today-list').innerHTML =
    [...todo, ...done].map(renderItem).join('');
}

function renderWeek() {
  const dates = getWeekDates();
  const todayDateStr = todayStr();
  const checkSvg = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

  document.getElementById('week-list').innerHTML = dates.map(date => {
    const dateStr = `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    const tasks = getSchedulesForDate(date);
    const isToday = dateStr === todayDateStr;
    const label = `${date.getMonth()+1}/${date.getDate()}（${WEEKDAY_NAMES[date.getDay()]}）`;
    if (tasks.length === 0) return '';
    const rows = tasks.map(t => {
      const assigneeStr = t.assignee ? `<span style="font-size:0.65rem;color:var(--kaji-primary);margin-left:4px;">👤${escapeHtml(t.assignee)}</span>` : '';
      const doneByStr = t.done && t.completedBy ? `<span style="font-size:0.65rem;color:var(--success);margin-left:4px;">✓${escapeHtml(t.completedBy)}</span>` : '';
      return `
      <div class="week-task-row ${t.done ? 'done' : ''}" id="wtask-${t.id}-${dateStr}">
        <div class="week-check" onclick="onToggleWeek('${t.id}','${dateStr}')">
          ${checkSvg}
        </div>
        <span class="week-task-name">${escapeHtml(t.name)}${assigneeStr}${doneByStr}</span>
        <span class="cat-tag cat-${escapeHtml(t.category)}" style="font-size:0.65rem">${escapeHtml(t.category)}</span>
      </div>`;
    }).join('');
    return `<div class="week-day-section">
      <div class="week-day-label ${isToday ? 'today' : ''}">${label}</div>
      ${rows}
    </div>`;
  }).join('');

  if (!document.getElementById('week-list').innerHTML.trim()) {
    document.getElementById('week-list').innerHTML =
      `<div class="empty-state"><div class="icon">📅</div><p>今週の家事はありません</p></div>`;
  }
}

function renderSettings() {
  if (kajiSchedules.length === 0) {
    document.getElementById('schedule-list').innerHTML =
      `<div class="empty-state"><div class="icon">⚙️</div><p>タスクが登録されていません</p></div>`;
    return;
  }
  document.getElementById('schedule-list').innerHTML = kajiSchedules.map(s => {
    const detail = s.frequency === 'weekly'
      ? (s.weekdays||[]).map(w=>WEEKDAY_NAMES[w]).join('・') + '曜'
      : `毎月${s.monthDay}日`;
    const assigneeStr = s.assignee ? ` | 👤${escapeHtml(s.assignee)}` : '';
    return `
      <div class="schedule-item">
        <div class="schedule-info">
          <div class="schedule-name">${escapeHtml(s.name)}</div>
          <div class="schedule-detail"><span class="cat-tag cat-${escapeHtml(s.category)}">${escapeHtml(s.category)}</span> ${detail}${assigneeStr}</div>
        </div>
        <button class="btn-edit-sch" onclick="openScheduleModal('${s.id}')">編集</button>
      </div>`;
  }).join('');
}

function renderKajiAll() {
  renderMembers();
  renderToday();
  renderWeek();
  renderSettings();
}

// ============================================================
//  家事管理 — メンバー管理
// ============================================================
function renderMembers() {
  const el = document.getElementById('member-list');
  if (!el) return;
  if (kajiMembers.length === 0) {
    el.innerHTML = '<span style="font-size:0.8rem;color:var(--muted);">メンバーなし（ログインで自動登録されます）</span>';
    return;
  }
  el.innerHTML = kajiMembers.map(m => `
    <span style="display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:0.82rem;">
      ${escapeHtml(m.name)}
      <button onclick="removeMember('${escapeHtml(m.name)}')" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.9rem;line-height:1;padding:0 2px;">×</button>
    </span>`).join('');
}

function updateAssigneeOptions() {
  const select = document.getElementById('sch-assignee');
  if (!select) return;
  const current = select.value;
  select.innerHTML = '<option value="">未設定</option>' +
    kajiMembers.map(m => `<option value="${escapeHtml(m.name)}">${escapeHtml(m.name)}</option>`).join('');
  select.value = current;
}

async function removeMember(name) {
  if (!confirm(`「${name}」をメンバーから削除しますか？`)) return;
  kajiMembers = kajiMembers.filter(m => m.name !== name);
  await MemberStorage.save(kajiMembers);
  renderMembers();
  updateAssigneeOptions();
}

document.getElementById('btn-add-member').addEventListener('click', async () => {
  const input = document.getElementById('new-member-name');
  const name = input.value.trim();
  if (!name) return;
  if (kajiMembers.some(m => m.name === name)) { alert('既に登録されています'); return; }
  kajiMembers.push({ name });
  await MemberStorage.save(kajiMembers);
  input.value = '';
  renderMembers();
  updateAssigneeOptions();
});

// ============================================================
//  家事管理 — スケジュールモーダル
// ============================================================
function openScheduleModal(id) {
  editingScheduleId = id || null;
  const sch = id ? kajiSchedules.find(s => s.id === id) : null;
  document.getElementById('schedule-modal-title').textContent = sch ? 'タスクを編集' : 'タスクを追加';
  document.getElementById('sch-name').value = sch ? sch.name : '';
  document.getElementById('sch-category').value = sch ? sch.category : '掃除';
  document.getElementById('sch-frequency').value = sch ? sch.frequency : 'weekly';
  document.getElementById('sch-monthday').value = sch ? (sch.monthDay||1) : 1;
  document.getElementById('btn-sch-delete').style.display = sch ? 'block' : 'none';

  // 担当者セレクト更新
  updateAssigneeOptions();
  document.getElementById('sch-assignee').value = sch ? (sch.assignee || '') : '';

  // 曜日ボタン初期化
  document.querySelectorAll('.wd-btn').forEach(btn => {
    const wd = parseInt(btn.dataset.wd);
    btn.classList.toggle('selected', sch && sch.frequency === 'weekly' && (sch.weekdays||[]).includes(wd));
  });

  updateSchModalSections();
  document.getElementById('schedule-modal').classList.remove('hidden');
}

function updateSchModalSections() {
  const freq = document.getElementById('sch-frequency').value;
  document.getElementById('sch-weekday-section').style.display = freq === 'weekly' ? 'block' : 'none';
  document.getElementById('sch-monthday-section').style.display = freq === 'monthly' ? 'block' : 'none';
}

document.getElementById('sch-frequency').addEventListener('change', updateSchModalSections);

document.querySelectorAll('.wd-btn').forEach(btn => {
  btn.addEventListener('click', () => btn.classList.toggle('selected'));
});

document.getElementById('btn-sch-cancel').addEventListener('click', () => {
  document.getElementById('schedule-modal').classList.add('hidden');
});

document.getElementById('btn-sch-save').addEventListener('click', async () => {
  const name = document.getElementById('sch-name').value.trim();
  if (!name) { alert('タスク名を入力してください'); return; }
  const freq = document.getElementById('sch-frequency').value;
  const weekdays = freq === 'weekly'
    ? Array.from(document.querySelectorAll('.wd-btn.selected')).map(b => parseInt(b.dataset.wd))
    : [];
  if (freq === 'weekly' && weekdays.length === 0) { alert('曜日を1つ以上選択してください'); return; }
  const monthDay = freq === 'monthly' ? parseInt(document.getElementById('sch-monthday').value)||1 : null;
  const assignee = document.getElementById('sch-assignee').value;

  if (editingScheduleId) {
    const sch = kajiSchedules.find(s => s.id === editingScheduleId);
    if (sch) { sch.name = name; sch.category = document.getElementById('sch-category').value; sch.frequency = freq; sch.weekdays = weekdays; sch.monthDay = monthDay; sch.assignee = assignee; }
  } else {
    kajiSchedules.push({ id: genId(), name, category: document.getElementById('sch-category').value, frequency: freq, weekdays, monthDay, assignee });
  }
  await KajiStorage.saveSchedules(kajiSchedules);
  document.getElementById('schedule-modal').classList.add('hidden');
  renderKajiAll();
});

document.getElementById('btn-sch-delete').addEventListener('click', async () => {
  if (!confirm('このタスクを削除しますか？')) return;
  kajiSchedules = kajiSchedules.filter(s => s.id !== editingScheduleId);
  await KajiStorage.saveSchedules(kajiSchedules);
  document.getElementById('schedule-modal').classList.add('hidden');
  renderKajiAll();
});

document.getElementById('btn-add-schedule').addEventListener('click', () => openScheduleModal(null));

async function onToggleToday(schId, dateStr) {
  await toggleCompletion(schId, dateStr);
  renderToday();
  renderWeek();
}
async function onToggleWeek(schId, dateStr) {
  await toggleCompletion(schId, dateStr);
  renderWeek();
  renderToday();
}

  { name: 'インターネット代',color: '#8b5cf6', keywords: ['ドコモ','au','ソフトバンク','ＳＯＦＴＢＡＮＫ','楽天モバイル','ＮＴＴ','フレッツ','ビッグローブ','インターネット','Ｗｉ－Ｆｉ'] },
  { name: '家賃',           color: '#ec4899', keywords: [] },
];
function classifyCategory(name) {
  // カスタムキーワードを優先チェック、削除済みキーワードは除外
  for (const cat of KAKEIBO_CATEGORIES) {
    const custom = customKeywords[cat.name] || [];
    const removed = removedKeywords[cat.name] || [];
    const all = [...custom, ...cat.keywords.filter(kw => !removed.includes(kw))];
    if (all.some(kw => name.includes(kw))) return cat.name;
  }
  return 'その他';
}
function categoryColor(name) {
  const cat = KAKEIBO_CATEGORIES.find(c => c.name === name);
  return cat ? cat.color : '#0d9488';
}

// カスタムキーワード（ユーザーが手動追加分）
let customKeywords = {}; // { "娯楽": ["XX"], "スーパー": ["YY"] }
let removedKeywords = {}; // { "娯楽": ["削除したデフォルトKW"] }
const CUSTOM_KW_DOC = db.collection('kakeibo').doc('custom_keywords');

async function loadCustomKeywords() {
  try {
    const snap = await CUSTOM_KW_DOC.get();
    if (snap.exists) {
      customKeywords = snap.data().keywords || {};
      removedKeywords = snap.data().removed || {};
      localStorage.setItem('kakeibo_custom_kw', JSON.stringify(customKeywords));
      localStorage.setItem('kakeibo_removed_kw', JSON.stringify(removedKeywords));
    } else {
      customKeywords = JSON.parse(localStorage.getItem('kakeibo_custom_kw')) || {};
      removedKeywords = JSON.parse(localStorage.getItem('kakeibo_removed_kw')) || {};
    }
  } catch(e) {
    customKeywords = JSON.parse(localStorage.getItem('kakeibo_custom_kw')) || {};
    removedKeywords = JSON.parse(localStorage.getItem('kakeibo_removed_kw')) || {};
  }
}
async function saveCustomKeywords() {
  localStorage.setItem('kakeibo_custom_kw', JSON.stringify(customKeywords));
  localStorage.setItem('kakeibo_removed_kw', JSON.stringify(removedKeywords));
  try { await CUSTOM_KW_DOC.set({ keywords: customKeywords, removed: removedKeywords, updatedAt: new Date() }); } catch(e){}
}

// ============================================================
//  家計簿 — データ層
// ============================================================
const RECORDS_DOC = db.collection('kakeibo').doc('records_v1');
const KakeiboStorage = {
  LS_KEY: 'kakeibo_records_v1',
  async load() {
    try {
      const snap = await RECORDS_DOC.get();
      if (snap.exists) {
        const data = snap.data().records || [];
        localStorage.setItem(this.LS_KEY, JSON.stringify(data));
        return data;
      }
      const local = this.loadLocal();
      if (local.length > 0) await this.save(local);
      return local;
    } catch(e) { return this.loadLocal(); }
  },
  async save(records) {
    localStorage.setItem(this.LS_KEY, JSON.stringify(records));
    try { await RECORDS_DOC.set({ records, updatedAt: new Date() }); } catch(e){}
  },
  loadLocal() {
    try { return JSON.parse(localStorage.getItem(this.LS_KEY)) || []; } catch { return []; }
  }
};

// ============================================================
//  家計簿 — CSV パース
// ============================================================
function parseKakeiboCSV(buffer) {
  const decoder = new TextDecoder('shift-jis');
  const text = decoder.decode(buffer);
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const records = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = splitCSVLine(lines[i]);
    if (cols.length < 6) continue;
    const dateStr = cols[0].trim();
    const name    = cols[2].trim();
    const amtRaw  = cols[5].trim();
    if (!dateStr || !name || !amtRaw) continue;
    const amount = parseInt(amtRaw.replace(/"/g,'').replace(/,/g,'').trim(), 10);
    if (isNaN(amount) || amount === 0) continue;
    records.push({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2,5) + i,
      date: dateStr, name, amount,
      category: amount < 0 ? '振替' : classifyCategory(name)
    });
  }
  return records;
}
function splitCSVLine(line) {
  const result = []; let current = ''; let inQuote = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') { inQuote = !inQuote; }
    else if (ch === ',' && !inQuote) { result.push(current); current = ''; }
    else { current += ch; }
  }
  result.push(current);
  return result;
}

// ============================================================
//  家計簿 — 状態
// ============================================================
let kakeiboRecords = [];
let kakeiboMonths  = [];
let currentMonthIdx = 0;
let selectedCategory = null;

function buildMonthList() {
  const monthSet = new Set(kakeiboRecords.map(r => r.date.slice(0,7)));
  kakeiboMonths = Array.from(monthSet).sort().reverse();
}

// ============================================================
//  家計簿 — 描画
// ============================================================
async function renderKakeibo() {
  const hasData = kakeiboRecords.length > 0;
  document.getElementById('kakeibo-empty').style.display  = hasData ? 'none'  : 'block';
  document.getElementById('month-selector').style.display = hasData ? 'flex'  : 'none';
  document.getElementById('kakeibo-summary').style.display= hasData ? 'block' : 'none';
  if (!hasData) { document.getElementById('kakeibo-detail').style.display = 'none'; return; }

  buildMonthList();
  if (currentMonthIdx >= kakeiboMonths.length) currentMonthIdx = 0;
  const month = kakeiboMonths[currentMonthIdx];
  document.getElementById('current-month-label').textContent = month.replace('/','年') + '月';

  const hasRent = kakeiboRecords.some(r => r.id === `rent_${month}`);
  if (!hasRent) {
    kakeiboRecords.push({ id:`rent_${month}`, date:`${month}/01`, name:'家賃', amount:100000, category:'家賃' });
    kakeiboRecords.sort((a,b) => b.date.localeCompare(a.date));
    await KakeiboStorage.save(kakeiboRecords);
  }

  const monthRecords = kakeiboRecords.filter(r => r.date.startsWith(month));
  const catMap = {}; let totalAmt = 0;
  for (const r of monthRecords) {
    if (r.category === '振替') continue;
    catMap[r.category] = (catMap[r.category]||0) + r.amount;
    totalAmt += r.amount;
  }
  const sign = totalAmt < 0 ? '-' : '';
  document.getElementById('summary-total').textContent = `合計 ${sign}¥${Math.abs(totalAmt).toLocaleString()}`;

  const sortedCats = Object.entries(catMap).sort((a,b) => Math.abs(b[1])-Math.abs(a[1]));
  drawPieChart(sortedCats);

  const maxAmt = Math.max(...sortedCats.map(([,v])=>Math.abs(v)), 1);
  document.getElementById('summary-rows').innerHTML = sortedCats.map(([cat,amt]) => {
    const pct = Math.round((Math.abs(amt)/maxAmt)*100);
    const color = categoryColor(cat);
    const isActive = selectedCategory === cat ? 'active' : '';
    const s = amt < 0 ? '-' : '';
    return `<div class="summary-row ${isActive}" data-cat="${escapeHtml(cat)}" onclick="selectCategory('${escapeHtml(cat)}')">
      <span class="summary-cat-label">${escapeHtml(cat)}</span>
      <div class="summary-bar-wrap"><div class="summary-bar" style="width:${pct}%;background:${color}"></div></div>
      <span class="summary-amount" style="color:${amt<0?'var(--danger)':'inherit'}">${s}¥${Math.abs(amt).toLocaleString()}</span>
    </div>`;
  }).join('');

  renderDetail(monthRecords);
}

let pieChartInstance = null;
function drawPieChart(sortedCats) {
  const positive = sortedCats.filter(([,v]) => v > 0);
  const total = positive.reduce((s,[,v]) => s+v, 0);
  if (total === 0) return;
  const labels = positive.map(([cat]) => cat);
  const data   = positive.map(([,amt]) => amt);
  const colors = positive.map(([cat]) => categoryColor(cat));
  const canvas = document.getElementById('pie-chart');
  if (pieChartInstance) { pieChartInstance.destroy(); pieChartInstance = null; }
  pieChartInstance = new Chart(canvas, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderColor:'#fff', borderWidth:2, hoverOffset:6 }] },
    options: {
      responsive: true, cutout: '58%',
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => { const pct=Math.round((ctx.raw/total)*100); return ` ${ctx.label}  ¥${ctx.raw.toLocaleString()} (${pct}%)`; } } }
      },
      animation: { duration: 400 }
    }
  });
  const legendEl = document.getElementById('pie-legend');
  legendEl.innerHTML = '';
  positive.forEach(([cat,amt],i) => {
    const pct = Math.round((amt/total)*100);
    const item = document.createElement('div');
    item.style.cssText = 'display:flex;align-items:center;gap:5px;cursor:pointer;';
    item.innerHTML = `<span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${colors[i]};flex-shrink:0;"></span><span>${cat} <strong>${pct}%</strong></span>`;
    item.addEventListener('click', () => {
      const meta = pieChartInstance.getDatasetMeta(0);
      const arcEl = meta.data[i];
      arcEl.hidden = !arcEl.hidden;
      item.style.opacity = arcEl.hidden ? '0.4' : '1';
      pieChartInstance.update();
    });
    legendEl.appendChild(item);
  });
}

function selectCategory(cat) {
  selectedCategory = selectedCategory === cat ? null : cat;
  renderKakeibo();
}

function renderDetail(monthRecords) {
  const detailEl = document.getElementById('kakeibo-detail');
  const records = selectedCategory ? monthRecords.filter(r => r.category === selectedCategory) : monthRecords;
  if (records.length === 0) { detailEl.style.display = 'none'; return; }
  detailEl.style.display = 'block';
  document.getElementById('detail-title').textContent = selectedCategory ? `${selectedCategory} の明細` : 'すべての明細';
  document.getElementById('detail-list').innerHTML = records.map(r => {
    const color = categoryColor(r.category);
    const sign = r.amount < 0 ? '-' : '';
    const isTransfer = r.category === '振替';
    const transferNote = isTransfer ? `<span style="font-size:11px;color:#9ca3af;margin-left:4px;">（参考）</span>` : '';
    return `<div class="detail-item" style="${isTransfer?'opacity:0.6;':''}">
      <span class="detail-date">${r.date.slice(5).replace('/','/') }</span>
      <span class="detail-name">${escapeHtml(r.name)}${transferNote}</span>
      <span class="detail-cat-tag kcat-${escapeHtml(r.category)}" style="background:${color}22;color:${color}">${escapeHtml(r.category)}</span>
      <span class="detail-amount" style="color:${r.amount<0?'var(--danger)':'inherit'}">${sign}¥${Math.abs(r.amount).toLocaleString()}</span>
      <button class="btn-delete" onclick="openEditModal('${escapeHtml(r.id||'')}')">✏️</button>
    </div>`;
  }).join('');
}

// ============================================================
//  家計簿 — 手動編集モーダル
// ============================================================
let editingRecordId = null;
function openEditModal(id) {
  const record = kakeiboRecords.find(r => r.id === id);
  if (!record) return;
  editingRecordId = id;
  document.getElementById('edit-name').value = record.name;
  document.getElementById('edit-amount').value = record.amount;
  document.getElementById('edit-category').value = record.category;
  document.getElementById('edit-modal').classList.remove('hidden');
}
document.getElementById('btn-modal-cancel').addEventListener('click', () => {
  document.getElementById('edit-modal').classList.add('hidden');
});
document.getElementById('btn-modal-save').addEventListener('click', async () => {
  const record = kakeiboRecords.find(r => r.id === editingRecordId);
  if (!record) return;
  record.name     = document.getElementById('edit-name').value.trim() || record.name;
  record.amount   = parseInt(document.getElementById('edit-amount').value, 10) || record.amount;
  record.category = document.getElementById('edit-category').value;
  await KakeiboStorage.save(kakeiboRecords);
  document.getElementById('edit-modal').classList.add('hidden');
  renderKakeibo();
});
document.getElementById('btn-modal-delete').addEventListener('click', async () => {
  if (!confirm('この明細を削除しますか？')) return;
  kakeiboRecords = kakeiboRecords.filter(r => r.id !== editingRecordId);
  await KakeiboStorage.save(kakeiboRecords);
  document.getElementById('edit-modal').classList.add('hidden');
  renderKakeibo();
});

// ============================================================
//  家計簿 — CSV取り込み・リセット
// ============================================================
document.getElementById('btn-import').addEventListener('click', () => {
  document.getElementById('csv-file-input').click();
});
document.getElementById('csv-file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    const newRecords = parseKakeiboCSV(ev.target.result);
    if (newRecords.length === 0) {
      alert('読み込めるデータがありませんでした。\n対応フォーマット: ご利用日,データ処理日,ご利用内容,…');
      return;
    }
    const existingKeys = new Set(kakeiboRecords.map(r => `${r.date}|${r.name}|${r.amount}`));
    const added = newRecords.filter(r => !existingKeys.has(`${r.date}|${r.name}|${r.amount}`));
    kakeiboRecords = [...kakeiboRecords, ...added].sort((a,b) => b.date.localeCompare(a.date));
    await KakeiboStorage.save(kakeiboRecords);
    selectedCategory = null; currentMonthIdx = 0;
    renderKakeibo();
    alert(`${added.length}件を追加しました。（重複 ${newRecords.length-added.length}件を除外）`);
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
});
document.getElementById('btn-reset').addEventListener('click', async () => {
  const pw = window.prompt('パスワードを入力してください');
  if (pw !== 'reset') { if (pw !== null) alert('パスワードが違います'); return; }
  if (!confirm('全データを削除します。この操作は元に戻せません。よろしいですか？')) return;
  kakeiboRecords = [];
  await KakeiboStorage.save([]);
  selectedCategory = null; currentMonthIdx = 0;
  renderKakeibo();
});
document.getElementById('btn-prev-month').addEventListener('click', () => {
  if (currentMonthIdx < kakeiboMonths.length-1) { currentMonthIdx++; selectedCategory=null; renderKakeibo(); }
});
document.getElementById('btn-next-month').addEventListener('click', () => {
  if (currentMonthIdx > 0) { currentMonthIdx--; selectedCategory=null; renderKakeibo(); }
});

// ============================================================
//  分類設定モーダル
// ============================================================
document.getElementById('btn-classify-settings').addEventListener('click', () => {
  renderClassifyModal();
  document.getElementById('classify-modal').classList.remove('hidden');
});
document.getElementById('btn-reclassify').addEventListener('click', async () => {
  if (!confirm('全明細を現在のキーワード設定で再分類します。手動で変更したカテゴリも上書きされます。よろしいですか？')) return;
  let count = 0;
  // 重複家賃を削除（rent_プレフィックスで同じIDが複数ないか）
  const rentIds = new Set();
  kakeiboRecords = kakeiboRecords.filter(r => {
    if (r.id && r.id.startsWith('rent_')) {
      if (rentIds.has(r.id)) return false; // 重複削除
      rentIds.add(r.id);
      r.category = '家賃'; // 家賃に戻す
    }
    return true;
  });
  for (const r of kakeiboRecords) {
    if (r.id && r.id.startsWith('rent_')) continue; // 家賃はスキップ
    if (r.amount < 0) continue; // 振替はスキップ
    const newCat = classifyCategory(r.name);
    if (r.category !== newCat) { r.category = newCat; count++; }
  }
  await KakeiboStorage.save(kakeiboRecords);
  renderKakeibo();
  alert(`${count}件のカテゴリを更新しました。`);
});
document.getElementById('btn-classify-close').addEventListener('click', () => {
  document.getElementById('classify-modal').classList.add('hidden');
});

function renderClassifyModal() {
  const container = document.getElementById('classify-list');
  const cats = KAKEIBO_CATEGORIES.filter(c => c.name !== '家賃' && c.name !== '振替');
  container.innerHTML = cats.map(cat => {
    const custom = customKeywords[cat.name] || [];
    const removed = removedKeywords[cat.name] || [];
    const activeBuiltIn = cat.keywords.filter(kw => !removed.includes(kw));
    const allTags = [
      ...activeBuiltIn.map(kw => `<span style="display:inline-flex;align-items:center;gap:3px;padding:3px 8px;margin:2px;border-radius:999px;font-size:0.75rem;background:${cat.color}22;color:${cat.color};cursor:pointer;" onclick="removeBuiltInKw('${escapeHtml(cat.name)}','${escapeHtml(kw)}')">${escapeHtml(kw)} ✕</span>`),
      ...custom.map(kw => `<span style="display:inline-flex;align-items:center;gap:3px;padding:3px 8px;margin:2px;border-radius:999px;font-size:0.75rem;background:${cat.color}44;color:${cat.color};cursor:pointer;font-weight:600;" onclick="removeCustomKw('${escapeHtml(cat.name)}','${escapeHtml(kw)}')">${escapeHtml(kw)} ✕</span>`)
    ].join('');
    const removedTags = removed.length > 0
      ? `<div style="margin-top:4px;"><span style="font-size:0.7rem;color:var(--muted);">削除済み:</span> ${removed.map(kw => `<span style="display:inline-flex;align-items:center;gap:3px;padding:2px 6px;margin:2px;border-radius:999px;font-size:0.7rem;background:#f3f4f6;color:#9ca3af;cursor:pointer;text-decoration:line-through;" onclick="restoreBuiltInKw('${escapeHtml(cat.name)}','${escapeHtml(kw)}')">${escapeHtml(kw)} ↩</span>`).join('')}</div>`
      : '';
    return `
      <div style="margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);">
        <div style="font-weight:600;font-size:0.88rem;margin-bottom:6px;">${escapeHtml(cat.name)}</div>
        <div style="line-height:1.8;">${allTags}</div>
        ${removedTags}
        <div style="display:flex;gap:6px;margin-top:6px;">
          <input type="text" placeholder="キーワードを追加" maxlength="30" id="kw-input-${escapeHtml(cat.name)}" style="flex:1;padding:6px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:0.85rem;" />
          <button onclick="addCustomKw('${escapeHtml(cat.name)}')" style="padding:6px 12px;background:var(--kakeibo-primary);color:#fff;border:none;border-radius:6px;font-size:0.82rem;cursor:pointer;">追加</button>
        </div>
      </div>`;
  }).join('');
}

async function addCustomKw(catName) {
  const input = document.getElementById(`kw-input-${catName}`);
  const kw = input.value.trim();
  if (!kw) return;
  if (!customKeywords[catName]) customKeywords[catName] = [];
  if (customKeywords[catName].includes(kw)) { alert('既に登録されています'); return; }
  customKeywords[catName].push(kw);
  await saveCustomKeywords();
  input.value = '';
  renderClassifyModal();
}

async function removeCustomKw(catName, kw) {
  if (!customKeywords[catName]) return;
  customKeywords[catName] = customKeywords[catName].filter(k => k !== kw);
  await saveCustomKeywords();
  renderClassifyModal();
}

async function removeBuiltInKw(catName, kw) {
  if (!removedKeywords[catName]) removedKeywords[catName] = [];
  if (!removedKeywords[catName].includes(kw)) removedKeywords[catName].push(kw);
  await saveCustomKeywords();
  renderClassifyModal();
}

async function restoreBuiltInKw(catName, kw) {
  if (!removedKeywords[catName]) return;
  removedKeywords[catName] = removedKeywords[catName].filter(k => k !== kw);
  await saveCustomKeywords();
  renderClassifyModal();
}

let currentApp = 'kaji';

document.querySelector('.top-nav').addEventListener('click', e => {
  const btn = e.target.closest('.top-nav-btn');

  document.querySelectorAll('.top-nav-btn').forEach(b => b.classList.remove('active'));

    currentApp === 'kaji' ? 'var(--kaji-primary)' : 'var(--kakeibo-primary)';

document.getElementById('kaji-sub-nav').addEventListener('click', e => {
  const btn = e.target.closest('.sub-nav-btn');

  const tab = btn.dataset.tab;
